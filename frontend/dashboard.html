<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dashboard | InkFlow</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="navbar">

        <a href="index.html" class="brand">

            <span class="brand-mark">
                I
            </span>

            InkFlow

        </a>

        <div class="nav-actions">

            <a
                href="create-blog.html"
                class="write-button">

                + Write

            </a>

            <a
                href="#"
                id="logoutButton"
                class="login-link">

                Logout

            </a>

        </div>

    </header>


    <main class="dashboard">

        <section class="dashboard-header">

            <div>

                <p class="section-label">
                    YOUR SPACE
                </p>

                <h1>
                    Welcome back,
                    <span id="dashboardUserName">
                        Writer.
                    </span>
                </h1>

                <p>
                    Manage your stories and keep
                    building in public.
                </p>

            </div>


            <a
                href="create-blog.html"
                class="primary-button">

                Create new story
                <span>↗</span>

            </a>

        </section>


        <section class="dashboard-stats">

            <div class="stat-card">

                <span>
                    STORIES
                </span>

                <strong id="storyCount">
                    00
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    VIEWS
                </span>

                <strong>
                    1.2K
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    FOLLOWERS
                </span>

                <strong>
                    24
                </strong>

            </div>

        </section>


        <section class="dashboard-content">

            <div class="section-heading">

                <div>

                    <p class="section-label">
                        YOUR STORIES
                    </p>

                    <h2>
                        Published
                        <span>work.</span>
                    </h2>

                </div>

            </div>


            <div
                class="story-list"
                id="publishedStories">

                <div class="empty-state">
                    <p>
                        Loading your stories...
                    </p>
                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
