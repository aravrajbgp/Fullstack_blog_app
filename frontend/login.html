<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | InkFlow</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <a href="index.html" class="brand">
            <span class="brand-mark">I</span>
            InkFlow
        </a>

        <div class="nav-actions">
            <span class="login-text">
                Don't have an account?
            </span>

            <a href="register.html" class="write-button">
                Register
            </a>
        </div>

    </header>


    <main class="auth-page">

        <section class="auth-card">

            <p class="section-label">
                WELCOME BACK
            </p>

            <h1>
                Sign in to
                <span>InkFlow.</span>
            </h1>

            <p class="auth-description">
                Continue reading, writing and sharing
                ideas with the community.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <button
                    type="submit"
                    class="form-button">
                    Sign In →
                </button>

            </form>


            <p class="form-footer">
                New to InkFlow?
                <a href="register.html">
                    Create an account
                </a>
            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
