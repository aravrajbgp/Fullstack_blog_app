<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | InkFlow</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <a href="index.html" class="brand">
            <span class="brand-mark">I</span>
            InkFlow
        </a>

        <div class="nav-actions">

            <span class="login-text">
                Already have an account?
            </span>

            <a href="login.html" class="write-button">
                Login
            </a>

        </div>

    </header>


    <main class="auth-page">

        <section class="auth-card">

            <p class="section-label">
                JOIN THE COMMUNITY
            </p>

            <h1>
                Create your
                <span>InkFlow.</span>
            </h1>

            <p class="auth-description">
                Create an account and start sharing
                ideas with curious minds.
            </p>


            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        required>

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="you@example.com"
                        required>

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required>

                </div>


                <button
                    type="submit"
                    class="form-button">
                    Create Account →
                </button>

            </form>


            <p class="form-footer">

                Already registered?

                <a href="login.html">
                    Sign in
                </a>

            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
